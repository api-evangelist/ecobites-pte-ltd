name: Ecobites Pte. Ltd.
description: >-
  Ecobites Pte. Ltd. operates Rec Rec, a Vietnamese consumer packaged-goods brand producing
  cricket-based snack foods marketed as high-protein, nutrient-dense alternatives to conventional
  snacks. Its product line spans cricket noodles (Mi Dam De), cricket puffs (Banh Phong De) in
  flavors such as Gochujang and Mala, and seasoned dried crickets (De Say). Products emphasize
  complete protein with a full amino-acid profile plus iron, zinc, magnesium, and potassium while
  keeping sodium low. Rec Rec is distributed through 7-Eleven, Farmers Market, Galaxy Cinema, BHD
  Cineplex, Naman Market, LS Place, Shopee, and TikTok Shop. The company is a 500 Global portfolio
  company and was added to the API Evangelist network as a lead. It publishes a consumer
  e-commerce website but no public developer or API surface.
